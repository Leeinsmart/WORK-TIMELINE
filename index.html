<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1d1d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工作時間表">
<title>工作項目時間管理</title>
<style>
:root{--bg:#121215;--card:#1d1d22;--ink:#f2f2f4;--ink2:#b5b5bd;--ink3:#84848d;--line:#33333a;--live:#e5484d;--soon:#f0b429;--paid:#3ecf8e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.5}
.top{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px}
.top .in,main{max-width:640px;margin:0 auto}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.02em}
.sub{color:var(--ink3);font-size:14px;margin-top:2px}
main{padding:16px}
h2{font-size:14px;font-weight:700;color:var(--ink3);margin:20px 0 8px}
h2:first-child{margin-top:0}
.job{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.head{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:64px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.head:active{background:#26262c;border-radius:14px}
.job.open .head{border-bottom:1px solid var(--line)}
.d{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:66px;line-height:1.1}
.w{font-size:13px;color:var(--ink3);font-weight:600}
.n{flex:1;min-width:0;font-size:17px;font-weight:700}
.st{font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap;text-align:right}
.st .tag{display:block;color:var(--paid)}
.job.today{border-color:var(--live)} .job.today .st{color:var(--live)}
.job.soon .st{color:var(--soon)}
.job.past{opacity:.75}
.job.arch .st{color:var(--paid)}
.arrow{color:var(--ink3);font-size:20px;transition:transform .15s}
.job.open .arrow{transform:rotate(90deg)}
.panel{display:none;padding:12px 16px 14px;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.job.open .panel{display:flex}
a.go{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px;
  border:1px solid var(--ink3);border-radius:10px;padding:8px 14px}
a.go:active{background:#26262c}
label.paid{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:700;color:var(--ink2);
  border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
label.paid input{width:22px;height:22px;margin:0;accent-color:var(--paid)}
label.paid.done{border-color:var(--paid);color:var(--paid)}
label.paid .when{font-weight:600;color:var(--ink3)}
label.paid.done .when{color:var(--paid)}
#paid-holder{display:none}
#arch-toggle{display:block;width:100%;margin:20px 0 8px;background:none;border:1px solid var(--line);border-radius:10px;
  color:var(--ink3);font:inherit;font-size:14px;font-weight:700;padding:10px 14px;cursor:pointer;text-align:left}
#arch-toggle:active{background:#26262c}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);max-width:calc(100% - 32px);opacity:0;pointer-events:none;
  background:#2a2a31;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;
  box-shadow:0 6px 20px rgba(0,0,0,.45);transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{color:var(--ink3);font-size:12px;text-align:center;padding:8px 16px 28px}

/* 下拉重新整理：關掉瀏覽器自帶的，改用頁面自己的一套，兩種開法（瀏覽器、主畫面）行為一致 */
html,body{overscroll-behavior-y:contain}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) - 48px);z-index:100;width:170px;margin-left:-85px;height:38px;
  border-radius:999px;background:#1d1d22;border:1px solid #33333a;color:#b5b5bd;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.ptr.back{transition:transform .2s}
.ptr.ready{color:#fff;border-color:#ff4d5a;background:#3a1b1f}
</style>

<body>
<header class="top"><div class="in"><h1>工作項目時間管理</h1><div class="sub">點一個工作：打開它的時間表，或勾「收到錢了」</div></div></header>
<main id="list"><ul><li><a href="https://leeinsmart.github.io/V8-0929-LIVE/">0929 沐容美學診所拍攝</a></li><li><a href="https://leeinsmart.github.io/MAVIS0930-LIVE/">0930 MAVIS活動工作時間表</a></li><li><a href="https://leeinsmart.github.io/HACHUU-1127-TPE/">1127 Hachuu 台北快閃工作時間表</a></li><li><a href="https://leeinsmart.github.io/HACHUU-1211-TXG/">1211 Hachuu 台中快閃工作時間表</a></li></ul></main>
<div id="paid-holder"><label class="paid" data-k="V8-0929-LIVE"><input type="checkbox"><span>收到錢了</span><span class="when"></span></label><label class="paid" data-k="MAVIS0930-LIVE"><input type="checkbox"><span>收到錢了</span><span class="when"></span></label><label class="paid" data-k="HACHUU-1127-TPE"><input type="checkbox"><span>收到錢了</span><span class="when"></span></label><label class="paid" data-k="HACHUU-1211-TXG"><input type="checkbox"><span>收到錢了</span><span class="when"></span></label></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<footer>2026-09-28 產生</footer>
<script id="data" type="application/json">[{"code": "V8-0929-LIVE", "date": "2026-09-29", "end": "2026-09-29", "tag": "0929", "name": "沐容美學診所拍攝", "url": "https://leeinsmart.github.io/V8-0929-LIVE/"}, {"code": "MAVIS0930-LIVE", "date": "2026-09-30", "end": "2026-09-30", "tag": "0930", "name": "MAVIS活動工作時間表", "url": "https://leeinsmart.github.io/MAVIS0930-LIVE/"}, {"code": "HACHUU-1127-TPE", "date": "2026-11-27", "end": "2026-11-29", "tag": "1127", "name": "Hachuu 台北快閃工作時間表", "url": "https://leeinsmart.github.io/HACHUU-1127-TPE/"}, {"code": "HACHUU-1211-TXG", "date": "2026-12-11", "end": "2026-12-13", "tag": "1211", "name": "Hachuu 台中快閃工作時間表", "url": "https://leeinsmart.github.io/HACHUU-1211-TXG/"}]</script>
<script>window.MV_CHECKLIST={"endpoint": "https://mv-count.tatujinx.workers.dev", "list": "WORK-TIMELINE-PAID"};</script>
<script>
const J = JSON.parse(document.getElementById('data').textContent);
const W = '日一二三四五六';
const pad = n => String(n).padStart(2, '0');
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function days(a, b) { return Math.round((Date.parse(b + 'T00:00:00') - Date.parse(a + 'T00:00:00')) / 864e5); }
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const list = document.getElementById('list'), holder = document.getElementById('paid-holder');
// 「收到錢了」的勾：每個工作一個 label（data-k＝發布代號），由 checklist.js 納管並跟 Worker 同步。
// 這些節點要活過每一次重畫（checklist.js 只在載入時掃一次），所以平常停在 #paid-holder，展開哪個工作就搬進它的面板。
const boxes = {};
holder.querySelectorAll('[data-k]').forEach(el => { boxes[el.dataset.k] = el; });
const byCode = {}; J.forEach(j => { byCode[j.code] = j; });
let paid = {};        // 項目代號 → {v,t,d,n}，由 checklist.js 透過 onapply 餵
let open = null;      // 現在展開的工作
let showArch = false; // 「已封存」有沒有攤開
const isPaid = c => !!(paid[c] && paid[c].v);
function paidDate(c) {
  const t = paid[c] && paid[c].t, d = t ? new Date(t) : null;
  return (d && !isNaN(d)) ? `${d.getMonth()+1}/${d.getDate()}` : '';
}
// 封存＝勾了收款、而且活動已經結束。還沒結束就先勾的留在看板上標「已收款」，結束當天自動收進已封存。
const archived = (j, t) => j.end < t && isPaid(j.code);
function card(j, t) {
  const n = days(t, j.date), dt = new Date(j.date + 'T00:00:00');
  const on = j.date <= t && t <= j.end, over = j.end < t, arch = archived(j, t);
  const cls = arch ? 'arch' : on ? 'today' : over ? 'past' : n <= 3 ? 'soon' : '';
  const st = arch ? `已收款 ${paidDate(j.code)}` : n === 0 ? '今天' : on ? `第 ${1 - n} 天` : over ? '已結束' : n === 1 ? '明天' : `${n} 天後`;
  const tag = (!arch && isPaid(j.code)) ? '<span class="tag">已收款</span>' : '';
  // 多天的活動在星期幾旁邊寫為期幾天（Lee 2026-09-28）；單日不寫
  const span = days(j.date, j.end) + 1;
  const isOpen = open === j.code;
  return `<div class="job ${cls}${isOpen ? ' open' : ''}" data-code="${esc(j.code)}">` +
    `<div class="head" role="button" tabindex="0" aria-expanded="${isOpen}">` +
    `<div><div class="d">${dt.getMonth()+1}/${dt.getDate()}</div><div class="w">週${W[dt.getDay()]}${span > 1 ? `・${span} 天` : ''}</div></div>` +
    `<div class="n">${esc(j.name)}</div><div class="st">${st}${tag}</div><div class="arrow">›</div></div>` +
    `<div class="panel"><a class="go" href="${esc(j.url)}">打開時間表 ›</a><span class="slot"></span></div></div>`;
}
function park() { Object.keys(boxes).forEach(k => holder.appendChild(boxes[k])); }
function render() {
  park();
  const t = today();
  Object.keys(boxes).forEach(k => {
    boxes[k].querySelector('.when').textContent = isPaid(k) ? `・${paidDate(k)}` : '';
  });
  const arch = J.filter(j => archived(j, t)).reverse();
  const live = J.filter(j => !archived(j, t));
  const up = live.filter(j => j.end >= t), past = live.filter(j => j.end < t).reverse();
  let h = up.length ? `<h2>進行中與接下來</h2>${up.map(j => card(j, t)).join('')}` : '<h2>目前沒有接下來的工作</h2>';
  if (past.length) h += `<h2>已結束，還沒收款</h2>${past.map(j => card(j, t)).join('')}`;
  if (arch.length) {
    h += `<button id="arch-toggle" type="button" aria-expanded="${showArch}">已封存 ${arch.length} 件（已結束並收款）${showArch ? ' ▴' : ' ▾'}</button>`;
    if (showArch) h += arch.map(j => card(j, t)).join('');
  }
  list.innerHTML = h;
  if (open) {
    const slot = list.querySelector(`.job[data-code="${open}"] .slot`);
    if (slot && boxes[open]) slot.appendChild(boxes[open]); else open = null;
  }
}
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
list.addEventListener('click', e => {
  const tg = e.target.closest('#arch-toggle');
  if (tg) { showArch = !showArch; render(); return; }
  const head = e.target.closest('.head');
  if (!head) return;
  const code = head.parentElement.dataset.code;
  open = (open === code) ? null : code;
  render();
});
list.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('head')) { e.preventDefault(); e.target.click(); }
});
Object.keys(boxes).forEach(k => {
  boxes[k].querySelector('input').addEventListener('change', ev => {
    const j = byCode[k], t = today();
    if (ev.target.checked) toast(j.end < t ? `「${j.name}」已收款，收進已封存` : `「${j.name}」已收款，活動結束後會收進已封存`);
    else toast(`「${j.name}」取消收款，回到看板`);
  });
});
window.MV_CHECKLIST.onapply = map => { paid = (map && typeof map === 'object') ? map : {}; render(); };
render();
setInterval(render, 60000);
</script>
<script>/* MOTIVIBES 跨裝置打勾清單 — 共用元件
 *
 * 用法：頁面在載入本檔前設定
 *   <script>window.MV_CHECKLIST={endpoint:"https://…workers.dev",list:"TIFF-2026",
 *                                  legacyKey:"舊的 localStorage key，選填"};<\/script>
 *   <script src="checklist.js"><\/script>          （或把全文內嵌）
 *
 * 契約：頁面上任何帶 data-k 的元素，只要裡面有 checkbox，就自動納管。
 *       V1 參展指南的關鍵時程本來就是這個結構，不必改標記。
 *
 * 行為：
 *   勾下去 → 畫面立刻反應、寫進本機、排入待送佇列、送出；送不出去就留在佇列
 *   開頁面 → 先補送佇列、再讀伺服器狀態覆蓋畫面（伺服器為準）
 *   離線可用，網路斷掉不會掉勾
 *
 * 頁面可選掛鉤：
 *   window.MV_CHECKLIST.onapply = function(map){…}   每次套用狀態後呼叫，map[項目代號]={v,t,d,n}
 */
(function () {
  "use strict";
  var CFG = window.MV_CHECKLIST;
  if (!CFG || !CFG.list) return;
  var online = !!CFG.endpoint;   // 沒設端點就只存本機，功能不停

  var LKEY = "mv_ck_" + CFG.list;          // 本機鏡像
  var QKEY = "mv_ckq_" + CFG.list;         // 待送佇列
  var MKEY = "mv_ckm_" + CFG.list;         // 已從舊 key 搬過的內容
  var DKEY = "mv_device_id";               // 與裝置計數器共用同一組裝置碼
  var NKEY = "mv_device_name";             // 這台裝置的名字，選填

  function ls(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k);
      if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
    } catch (e) {}
    return null;
  }
  function jget(k, dflt) { try { return JSON.parse(ls(k) || "") || dflt; } catch (e) { return dflt; } }
  function jput(k, o) { ls(k, JSON.stringify(o)); }

  var dev = ls(DKEY);
  if (!dev) {
    dev = (self.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : String(Date.now()) + Math.random().toString(36).slice(2);
    ls(DKEY, dev);
  }
  var name = ls(NKEY) || "";

  var items = {};   // 項目代號 → {li, box}
  Array.prototype.forEach.call(document.querySelectorAll("[data-k]"), function (el) {
    var box = el.querySelector('input[type=checkbox]');
    if (box && el.dataset.k) items[el.dataset.k] = { li: el, box: box };
  });
  if (!Object.keys(items).length) return;

  function apply(map) {
    Object.keys(items).forEach(function (k) {
      var rec = map[k], on = !!(rec && rec.v);
      items[k].box.checked = on;
      items[k].li.classList.toggle("done", on);
    });
    if (typeof CFG.onapply === "function") { try { CFG.onapply(map); } catch (e) {} }
  }

  function url(item, val) {
    return CFG.endpoint + "/ck?l=" + encodeURIComponent(CFG.list) +
      (item ? "&i=" + encodeURIComponent(item) + "&v=" + (val ? 1 : 0) +
              "&d=" + encodeURIComponent(dev) + "&n=" + encodeURIComponent(name) : "");
  }

  // 佇列：{項目代號: 0|1}，只留最後一次意圖，同一項重複勾不會累積
  function queue(item, val) {
    var q = jget(QKEY, {}); q[item] = val ? 1 : 0; jput(QKEY, q);
  }
  function flush() {
    var q = jget(QKEY, {}), keys = Object.keys(q);
    if (!online || !keys.length) return Promise.resolve();
    return Promise.all(keys.map(function (k) {
      return fetch(url(k, q[k]), { method: "POST", keepalive: true })
        .then(function (r) {
          // 只有 204 才算真的寫進去：舊版 Worker 對未知路徑回 200 "ok"，
          // 當成成功會把還沒送出的勾直接刪掉，而且沒有人會發現。
          if (r.status === 204) { var c = jget(QKEY, {}); delete c[k]; jput(QKEY, c); }
        })
        .catch(function () {});
    }));
  }

  function pull() {
    if (!online) return Promise.resolve();
    return fetch(url(null), { cache: "no-store" })
      .then(function (r) {
        var ct = r.headers.get("Content-Type") || "";
        return (r.ok && ct.indexOf("json") >= 0) ? r.json() : null;
      })
      .then(function (map) {
        if (!map || typeof map !== "object" || Array.isArray(map)) return;
        // 還沒送出去的勾疊在伺服器狀態上：某一筆 POST 失敗時，
        // 不能讓她剛勾的那條在畫面上當場消失（它其實還在佇列裡等重送）。
        var pending = jget(QKEY, {}), local = jget(LKEY, {});
        Object.keys(pending).forEach(function (k) {
          map[k] = local[k] || { v: pending[k], t: new Date().toISOString(), d: dev, n: name };
        });
        jput(LKEY, map); apply(map);
      })
      .catch(function () {});
  }

  // 舊 key 搬家：增量，每次載入都比對一次。
  // 只搬一次是不夠的——舊版頁面還在線上時，使用者可能繼續在那邊勾，
  // 那些勾只會落在舊 key 裡，永遠上不了伺服器，看起來就是「勾了卻沒同步」。
  // 用 MKEY 記住上次搬過的內容，只處理有變動的項目，不會把她主動取消的勾救回來。
  if (CFG.legacyKey) {
    var legacy = jget(CFG.legacyKey, null);
    if (legacy && typeof legacy === "object") {
      var done = jget(MKEY, {}), mirror = jget(LKEY, {}), q = jget(QKEY, {}),
          now = new Date().toISOString(), moved = 0;
      Object.keys(legacy).forEach(function (k) {
        var v = legacy[k] ? 1 : 0;
        if (done[k] === v) return;               // 這一項上次就搬過了，狀態也沒變
        done[k] = v; moved++;
        mirror[k] = { v: v, t: now, d: dev, n: name };
        q[k] = v;
      });
      if (moved) { jput(MKEY, done); jput(LKEY, mirror); jput(QKEY, q); }
    }
  }

  // 1) 先用本機鏡像上色，離線也看得到自己的進度
  apply(jget(LKEY, {}));

  // 2) 補送離線期間的勾，再以伺服器狀態為準
  if (online) flush().then(pull);

  Object.keys(items).forEach(function (k) {
    items[k].box.addEventListener("change", function () {
      var on = items[k].box.checked;
      items[k].li.classList.toggle("done", on);
      var mirror = jget(LKEY, {});
      mirror[k] = { v: on ? 1 : 0, t: new Date().toISOString(), d: dev, n: name };
      jput(LKEY, mirror);
      if (typeof CFG.onapply === "function") { try { CFG.onapply(mirror); } catch (e) {} }
      queue(k, on);
      if (online) flush();
    });
  });

  // 回到分頁時重讀一次，對方剛勾的會補上來
  document.addEventListener("visibilitychange", function () {
    if (online && !document.hidden) flush().then(pull);
  });

  window.MV_CHECKLIST.refresh = function () { return flush().then(pull); };
  window.MV_CHECKLIST.setName = function (n) { name = String(n || "").slice(0, 24); ls(NKEY, name); };
})();
</script>
<script>
(function () {
  const TH = 80;                       // 手指往下拉超過 80px 放開才重新整理，避免碰一下就觸發
  const bar = document.createElement('div');
  bar.className = 'ptr'; bar.setAttribute('aria-hidden', 'true');
  document.body.appendChild(bar);
  const atTop = () => (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
  let y0 = null, dy = 0;
  function reset() { bar.classList.add('back'); bar.classList.remove('ready'); bar.style.transform = ''; y0 = null; dy = 0; }
  addEventListener('touchstart', e => {
    y0 = (e.touches.length === 1 && atTop() && !document.body.classList.contains('timing')) ? e.touches[0].clientY : null;
    dy = 0;
  }, {passive: true});
  addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || !atTop()) { reset(); return; }
    bar.classList.remove('back');
    bar.style.transform = `translateY(${Math.min(dy * 0.6, 70)}px)`;
    const ready = dy >= TH;
    bar.classList.toggle('ready', ready);
    bar.textContent = ready ? '放開重新整理' : '下拉重新整理';
  }, {passive: true});
  addEventListener('touchend', () => {
    if (y0 !== null && dy >= TH) {
      // 加到 iPhone 主畫面後，一般的重新載入常拿到快取的舊版（Lee 2026-09-28）：
      // 先跳過快取重抓原網址（順便把快取換成新版，下次從桌面開也是新的），再用帶時間戳的網址打開
      bar.textContent = '重新整理中…';
      const go = () => location.replace(location.pathname + '?r=' + Date.now() + location.hash);
      fetch(location.pathname, {cache: 'reload'}).then(go, go);
      return;
    }
    reset();
  });
  addEventListener('touchcancel', reset);
})();
</script>
