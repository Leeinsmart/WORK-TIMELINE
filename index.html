<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1d1d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工作時間表">
<title>工作項目時間管理</title>
<style>
:root{--bg:#121215;--card:#1d1d22;--ink:#f2f2f4;--ink2:#b5b5bd;--ink3:#84848d;--line:#33333a;--live:#e5484d;--soon:#f0b429}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.5}
.top{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px}
.top .in,main{max-width:640px;margin:0 auto}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.02em}
.sub{color:var(--ink3);font-size:14px;margin-top:2px}
main{padding:16px}
h2{font-size:14px;font-weight:700;color:var(--ink3);margin:20px 0 8px}
h2:first-child{margin-top:0}
a.job{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;min-height:64px}
a.job:active{background:#26262c}
.d{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:66px;line-height:1.1}
.w{font-size:13px;color:var(--ink3);font-weight:600}
.n{flex:1;min-width:0;font-size:17px;font-weight:700}
.st{font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.job.today{border-color:var(--live)} .job.today .st{color:var(--live)}
.job.soon .st{color:var(--soon)}
.job.past{opacity:.55}
.arrow{color:var(--ink3);font-size:20px}
footer{color:var(--ink3);font-size:12px;text-align:center;padding:8px 16px 28px}
</style>
</head>
<body>
<header class="top"><div class="in"><h1>工作項目時間管理</h1><div class="sub">點一個工作，進到那一天的時間表</div></div></header>
<main id="list"><ul><li><a href="https://leeinsmart.github.io/MAVIS0930-LIVE/">0930 MAVIS活動工作時間表</a></li></ul></main>
<footer>2026-09-28 產生</footer>
<script id="data" type="application/json">[{"date": "2026-09-30", "tag": "0930", "name": "MAVIS活動工作時間表", "url": "https://leeinsmart.github.io/MAVIS0930-LIVE/"}]</script>
<script>
const J = JSON.parse(document.getElementById('data').textContent);
const W = '日一二三四五六';
const pad = n => String(n).padStart(2, '0');
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function days(a, b) { return Math.round((Date.parse(b + 'T00:00:00') - Date.parse(a + 'T00:00:00')) / 864e5); }
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function card(j, t) {
  const n = days(t, j.date), dt = new Date(j.date + 'T00:00:00');
  const cls = n === 0 ? 'today' : n < 0 ? 'past' : n <= 3 ? 'soon' : '';
  const st = n === 0 ? '今天' : n < 0 ? '已結束' : n === 1 ? '明天' : `${n} 天後`;
  return `<a class="job ${cls}" href="${esc(j.url)}"><div><div class="d">${dt.getMonth()+1}/${dt.getDate()}</div><div class="w">週${W[dt.getDay()]}</div></div><div class="n">${esc(j.name)}</div><div class="st">${st}</div><div class="arrow">›</div></a>`;
}
function render() {
  const t = today(), up = J.filter(j => j.date >= t), past = J.filter(j => j.date < t).reverse();
  let h = up.length ? `<h2>進行中與接下來</h2>${up.map(j => card(j, t)).join('')}` : '<h2>目前沒有接下來的工作</h2>';
  if (past.length) h += `<h2>已結束</h2>${past.map(j => card(j, t)).join('')}`;
  document.getElementById('list').innerHTML = h;
}
render();
setInterval(render, 60000);
</script>
<!--mv-pagecount v1-->
<script>(function(){try{var K="mv_device_id",i=localStorage.getItem(K);if(!i){i=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);localStorage.setItem(K,i);}var u="https://mv-count.tatujinx.workers.dev/hit?p=WORK-TIMELINE&d="+encodeURIComponent(i);if(navigator.sendBeacon){navigator.sendBeacon(u);}else{fetch(u,{mode:"no-cors",keepalive:true});}}catch(e){}})();</script>
</body>
</html>
